services:
  - type: web
    name: voxera
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: VOXERA_ENV
        value: production
      - key: VOXERA_SECRET
        generateValue: true
      - key: VOXERA_DATABASE_URL
        sync: false
      - key: VOXERA_S3_ENDPOINT_URL
        sync: false
      - key: VOXERA_S3_BUCKET
        sync: false
      - key: VOXERA_S3_ACCESS_KEY_ID
        sync: false
      - key: VOXERA_S3_SECRET_ACCESS_KEY
        sync: false
      - key: VOXERA_S3_REGION
        value: auto
      - key: VOXERA_REDIS_URL
        sync: false
      - key: VOXERA_FOLLOWUP_SCHEDULER
        value: disabled
      - key: VOXERA_FEATURE_RATE_LIMITING
        value: "true"
      - key: VOXERA_SCHEDULED_JOB_SECRET
        sync: false
      - key: VOXERA_EMAIL_VERIFICATION
        value: "false"
      - key: VOXERA_SMTP_HOST
        sync: false
      - key: VOXERA_SMTP_PORT
        value: "587"
      - key: VOXERA_SMTP_USERNAME
        sync: false
      - key: VOXERA_SMTP_PASSWORD
        sync: false
      - key: VOXERA_EMAIL_FROM
        sync: false
      - key: VOXERA_ALLOWED_ORIGINS
        sync: false
      - key: VOXERA_PUBLIC_URL
        sync: false
      - key: VOXERA_API_PUBLIC_URL
        sync: false
      - key: VOXERA_GOOGLE_CLIENT_ID
        sync: false
      - key: VOXERA_GOOGLE_CLIENT_SECRET
        sync: false
